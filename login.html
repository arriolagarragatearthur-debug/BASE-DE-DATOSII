<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Base de Datos II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand-cluster">
    <a href="index.html" class="brand-logo" aria-label="Ir al inicio">
  <img src="assets/logo-upla.png" alt="Logo de la UPLA" class="uni-logo">
  <span class="brand-logo__text">UPLA</span>
</a>
    <span class="brand-divider" aria-hidden="true"></span>
    <a href="index.html" class="brand-mark" aria-label="Base de Datos II">
      <span class="brand-mark__dot"></span>
      <span class="brand-mark__code">AR</span>
    </a>
    <nav class="menu" aria-label="Navegación principal">
      <a href="index.html" class="menu__link" data-text="Inicio">Inicio</a>
      <a href="sobreMi.html" class="menu__link" data-text="Sobre mí">Sobre mí</a>
      <a href="unidades.html" class="menu__link" data-text="Unidades">Unidades</a>
      <a href="login.html" class="menu__link menu__link--auth is-active" data-text="Iniciar sesión">Iniciar sesión</a>
    </nav>
  </div>
  <div class="topbar__actions">
    <div class="hud">
      <span class="hud__coins"><span class="hud__coin-icon">🪙</span><span id="score">0</span></span>
      <button class="music-toggle" id="musicToggle" aria-pressed="false" aria-label="Activar música">🔇</button>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="menu" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>
  <section class="login login--standalone">
    <div class="login__panel">
      <p class="login__eyebrow">Acceso</p>
      <h2 class="login__title">Iniciar sesión</h2>
      <form class="login__form" id="loginForm">
        <label class="field">
          <span class="field__label">Usuario</span>
          <input class="field__input" type="text" name="usuario" placeholder="usuario" autocomplete="username" required>
        </label>
        <label class="field">
          <span class="field__label">Contraseña</span>
          <input class="field__input" type="password" name="clave" placeholder="••••••••" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn--primary btn--block">Entrar</button>
        <p class="login__note" id="loginNote" role="status"></p>
      </form>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="footer__row">
    <span class="footer__name">Arriola Garragate Anderson Ricardo</span>
    <span class="footer__sep">·</span>
    <span class="footer__course">Base de Datos II</span>
  </div>
  <div class="footer__row footer__row--muted">
    <span>Ingeniería de Sistemas y Computación — Universidad Peruana Los Andes, Huancayo</span>
  </div>
  <div class="footer__row footer__row--muted">
    <span>&copy; <span id="year"></span> Todos los derechos reservados.</span>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
